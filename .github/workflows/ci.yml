name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

        # ----------------  API - PYTHON LINT TEST  ---------------- #

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
#          cache: 'pip'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 on project
        run: flake8 --exclude=__pycache__,node_modules .
        # run: flake8 --exclude=.git,__pycache__,.venv,.env,.mypy_cache,.pytest_cache,node_modules .

        # ----------------  FRONTEND ES LINT TEST ---------------- #
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
#          cache: 'npm'

      - name: Install eslint with other packages
        run: |
          cd frontend
          npm install

      - name: Run eslint
        run: |
          cd frontend
          npm run lint # configured in package.json

      # ---------------- DOCKERFILE LINT TEST ---------------- #

      - name: Install Hadolint
        run: |
          wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x hadolint

      - name: Run Hadolint
        run: ./hadolint api/Dockerfile worker/Dockerfile frontend/Dockerfile
        # run: ./hadolint --ignore DL3018 --ignore DL3015 --ignore DL3008 api/Dockerfile worker/Dockerfile frontend/Dockerfile
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
#          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Test with pytest
        run: |
          pytest --cov=api --cov-report=xml --cov-fail-under=85
#          pytest tests.py --doctest-modules --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set SHA
        run: echo "GIT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          
      # ---------------- API ----------------
      - name: Build API image
        run: |
          docker build --pull --no-cache \
            -t ghcr.io/${{ github.repository }}/api:${{ env.GIT_SHA }} \
            -t ghcr.io/${{ github.repository }}/api:latest \
            ./api

      - name: Push API image
        run: |
          docker push ghcr.io/${{ github.repository }}/api:${{ env.GIT_SHA }}
          docker push ghcr.io/${{ github.repository }}/api:latest


      # ---------------- WORKER ----------------
      - name: Build Worker image
        run: |
          docker build --pull --no-cache \
            -t ghcr.io/${{ github.repository }}/worker:${{ env.GIT_SHA }} \
            -t ghcr.io/${{ github.repository }}/worker:latest \
            ./worker

      - name: Push API image
        run: |
          docker push ghcr.io/${{ github.repository }}/worker:${{ env.GIT_SHA }}
          docker push ghcr.io/${{ github.repository }}/worker:latest


      # ---------------- FRONTEND ----------------
      - name: Build Worker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/frontend:${{ env.GIT_SHA }} \
            -t ghcr.io/${{ github.repository }}/frontend:latest \
            ./frontend

      - name: Push API image
        run: |
          docker push ghcr.io/${{ github.repository }}/frontend:${{ env.GIT_SHA }}
          docker push ghcr.io/${{ github.repository }}/frontend:latest


  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Required to checkout and read repo files
      security-events: write  # Required to upload SARIF results to the GitHub Security tab

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set SHA
        run: |
          echo "GIT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

#      - name: Pull images
#        run: |
#          docker pull ghcr.io/${{ github.repository }}/api:${{ env.GIT_SHA }}
#          docker pull ghcr.io/${{ github.repository }}/worker:${{ env.GIT_SHA }}
#          docker pull ghcr.io/${{ github.repository }}/frontend:${{ env.GIT_SHA }}

    # No need to pull images
    # Trivy csn scan remote images



      # ---------------- API ----------------
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/api:${{ env.GIT_SHA }}
          format: sarif
          output: api-trivy-results.sarif
          exit-code: '1'
          limit-severities-for-sarif: true
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln

      # ---------------- WORKER ----------------
      - name: Scan WORKER image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/worker:${{ env.GIT_SHA }}
          format: sarif
          output: worker-trivy-results.sarif
          exit-code: '1'
          severity: CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          scanners: vuln

      # ---------------- FRONTEND ----------------
      - name: Scan FRONTEND image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/frontend:${{ env.GIT_SHA }}
          format: sarif
          output: frontend-trivy-results.sarif
          exit-code: '1'
          limit-severities-for-sarif: true
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln

      # ---------------- UPLOAD SCAN RESULTS ----------------

      - name: Upload API scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: api-trivy-results.sarif
          category: api

      - name: Upload Frontend scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: frontend-trivy-results.sarif
          category: frontend

      - name: Upload Worker scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: worker-trivy-results.sarif
          category: worker
  integration:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set SHA
        run: |
          echo "GIT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Pull images
        run: |
          docker pull ghcr.io/${{ github.repository }}/api:${{ env.GIT_SHA }}
          docker pull ghcr.io/${{ github.repository }}/worker:${{ env.GIT_SHA }}
          docker pull ghcr.io/${{ github.repository }}/frontend:${{ env.GIT_SHA }}

      - name: Build System
        run: |
          docker compose up -d
      
      - name: Wait for Services
        run: sleep 15
      
      - name: Submit job and Poll until completion
        run: python integration.py
          
      - name: Graceful Teardown
        if: always()
        run: docker compose down
  deploy:
    needs: integration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set SHA
        run: echo "GIT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull images
        run: |
          docker pull ghcr.io/${{ github.repository }}/api:${{ env.GIT_SHA }}
          docker pull ghcr.io/${{ github.repository }}/worker:${{ env.GIT_SHA }}
          docker pull ghcr.io/${{ github.repository }}/frontend:${{ env.GIT_SHA }}

      # Start current system (baseline)
      - name: Start existing system
        run: docker compose up -d

      # Get compose network
      - name: Get network name
        run: |
          NET=$(docker network ls --format '{{.Name}}' | grep worker-api-network | head -n 1)
          echo "NETWORK=$NET" >> $GITHUB_ENV

      # ================= API =================
      - name: Start new API (candidate)
        run: |
          docker run -d \
            --name api_new \
            --network $NETWORK \
            -e REDIS_HOST=redis \
            -p 8001:8000 \
            ghcr.io/${{ github.repository }}/api:${{ env.GIT_SHA }}

      - name: Verify new API
        run: |
          for i in {1..12}; do
            if curl -f http://localhost:8001/api/health; then
              echo "API healthy"
              exit 0
            fi
            sleep 5
          done
          echo "API failed health check"
          docker rm -f api_new
          exit 1

      - name: Promote API
        run: |
          docker rm -f api || true
          docker run -d \
            --name api \
            --network $NETWORK \
            -e REDIS_HOST=redis \
            -p 8000:8000 \
            ghcr.io/${{ github.repository }}/api:${{ env.GIT_SHA }}
          docker rm -f api_new || true

      # ================= WORKER =================
      - name: Start new Worker
        run: |
          docker run -d \
            --name worker_new \
            --network $NETWORK \
            -e REDIS_HOST=redis \
            ghcr.io/${{ github.repository }}/worker:${{ env.GIT_SHA }}

      - name: Verify Worker
        run: |
          sleep 10
          docker exec worker_new python -c "
          import redis, os
          r = redis.Redis(host=os.getenv('REDIS_HOST','redis'), port=6379)
          exit(0 if r.ping() else 1)
          "

      - name: Promote Worker
        run: |
          docker rm -f worker || true
          docker rename worker_new worker

      # ================= FRONTEND =================
      - name: Start new Frontend
        run: |
          docker run -d \
            --name frontend_new \
            --network $NETWORK \
            -p 3001:3000 \
            ghcr.io/${{ github.repository }}/frontend:${{ env.GIT_SHA }}

      - name: Verify Frontend
        run: |
          for i in {1..12}; do
            if curl -f http://localhost:3001; then
              echo "Frontend healthy"
              exit 0
            fi
            sleep 5
          done
          docker rm -f frontend_new
          exit 1

      - name: Promote Frontend
        run: |
          docker rm -f frontend || true
          docker run -d \
            --name frontend \
            --network $NETWORK \
            -p 3000:3000 \
            ghcr.io/${{ github.repository }}/frontend:${{ env.GIT_SHA }}
          docker rm -f frontend_new || true

      # ================= CLEANUP =================
      - name: Cleanup
        if: always()
        run: docker system prune -f

