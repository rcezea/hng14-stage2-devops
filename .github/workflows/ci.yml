name: CI Pipeline

on:
  push:
    branches:
      - main
# pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

        # ----------------  API - PYTHON LINT TEST  ---------------- #

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
#          cache: 'pip'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 on project
        run: flake8 --exclude=__pycache__,node_modules .
        # run: flake8 --exclude=.git,__pycache__,.venv,.env,.mypy_cache,.pytest_cache,node_modules .

        # ----------------  FRONTEND ES LINT TEST ---------------- #
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
#          cache: 'npm'

      - name: Install eslint with other packages
        run: |
          cd frontend
          npm install

      - name: Run eslint
        run: |
          cd frontend
          npm run lint # configured in package.json

      # ---------------- DOCKERFILE LINT TEST ---------------- #

      - name: Install Hadolint
        run: |
          wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x hadolint

      - name: Run Hadolint
        run: ./hadolint api/Dockerfile worker/Dockerfile frontend/Dockerfile
        # run: ./hadolint --ignore DL3018 --ignore DL3015 --ignore DL3008 api/Dockerfile worker/Dockerfile frontend/Dockerfile
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
#          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Test with pytest
        run: |
          pytest --cov=api --cov-report=xml --cov-fail-under=85
#          pytest tests.py --doctest-modules --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
